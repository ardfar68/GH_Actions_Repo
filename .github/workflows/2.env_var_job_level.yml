# Can be overridden at step level only
# Is available in all steps of that job (not just steps beneath the declaration, but the entire job)

name: 2_job level environment variables
on:
  workflow_dispatch:
  # push:
  #   branches: 
  #     - dev
  #   branches-ignore:
  #     - dev


jobs:
  job1:
    name: Job 1
    runs-on: ubuntu-latest

    env: # accessed in all steps in this job only (can be placed also all steps but not before name:)
      var1: Hello From Job Level 1
      var2: Hello From Job Level 2


    steps:
      - name: using shell-style variable expansion
        run: |
          echo job level env var1: $var1
          echo job level env var2: $var2

      - name: using GH actions expression syntax
        run: |
          echo job level env var1: ${{ env.var1 }}
          echo job level env var2: ${{ env.var2 }}

      - name: using if statement
        if: ${{ always() && env.var1 == 'Hello From Job Level 1' }}
        run: |
          echo "The result of 2 * 3 is:" $((2 * 3))


  