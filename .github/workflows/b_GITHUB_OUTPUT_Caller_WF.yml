name: a2_caller_wf
on:
  workflow_dispatch:
  push:
    branches:
      - dev1

jobs:
  job1_in_caller_wf:
    uses: ./.github/workflows/a_GITHUB_OUTPUT_Reusable_WF.yml

  job2_in_caller_wf:
    runs-on: ubuntu-latest
    needs: job1_in_caller_wf
    steps:
      - name: Print the four arithmetic operations from reusable workflow
        run: |
          printf "%-50s %s\n"
            "sum result from reusable-wf job1:" \
            "${{ needs.job1_in_caller_wf.outputs.finalSum }}"
          printf "%-50s %s\n"
            "division result from reusable-wf job1:" \
            "${{ needs.job1_in_caller_wf.outputs.finalDivision }}"
          printf "%-50s %s\n"
            "multiplication result from reusable-wf job2:" \
            "${{ needs.job1_in_caller_wf.outputs.finalMulti }}"
          printf "%-50s %s\n"
            "subtraction result from reusable-wf job2:" \
            "${{ needs.job1_in_caller_wf.outputs.finalSubtraction }}"