name: call_reusable_wf
on:
  workflow_dispatch:  # allows you to trigger manually

jobs:
  call-workflow:
    uses: ./.github/workflows/a_GITHUB_OUTPUT_Reusable_WF.yml

  print-output:
    runs-on: ubuntu-latest
    needs: call-workflow
    steps:
      - name: Print finalSum from reusable workflow
        run: echo finalSum from called workflow ${{ needs.call-workflow.outputs.finalSum }}
