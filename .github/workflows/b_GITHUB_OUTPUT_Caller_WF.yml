name: a2_caller_wf
on:
  workflow_dispatch:

jobs:
  job1_in_caller_wf:
    uses: ./.github/workflows/a_GITHUB_OUTPUT_Reusable_WF.yml

  job2_in_caller_wf:
    runs-on: ubuntu-latest
    needs: job1_in_caller_wf
    steps:
      - name: Print finalSum from reusable workflow
        run: |
          echo finalSum from called workflow:"
          echo ${{ needs.job1_in_caller_wf.outputs.finalSum }}
