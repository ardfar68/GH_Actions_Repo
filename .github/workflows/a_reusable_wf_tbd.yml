name: a1_reusable_wf_tbd
on:
  push:
    branches:
      - dev1
  workflow_call:
    inputs:
      exampleInputNew:
        description: "default value"
        required: true
        type: string

    secrets:
      asf_secret:
        description: A secret that caller must provide
        required: false

jobs:
  job1_write_to_output:
    runs-on: ubuntu-latest
    steps:
      - name: Use the secret
        id: use_secret
        run: |
          echo input value from workflow_call is: ${{ inputs.exampleInputNew }}
          echo secret value from workflow_call is: ${{ secrets.asf_secret }}
          echo secret value from workflow_call is: ${asf_secret:0:7}