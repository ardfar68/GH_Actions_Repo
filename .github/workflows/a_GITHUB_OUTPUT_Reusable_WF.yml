name: a1_reusable_wf
on:
  workflow_dispatch:
  push:
    branches:
      - dev1
  workflow_call:
    inputs:
      exampleInput:
        description: A secret the caller must provide
        required: true
        type: string
        
    secrets:
      MY_SECRET:
        description: A secret the caller must provide
        required: true
  
    outputs:
      finalSum:
        description: The sum from job1
        value: > 
          First value: ${{ jobs.write_to_output.outputs.sum }}
      
      finalDivision: 
        description: The division from job1
        value: >
          First value: ${{ jobs.write_to_output.outputs.division }}
      
      finalMulti:
        description: The multiplication from job2
        value: >
          First value: ${{ jobs.write_to_output.outputs.multiplication }}
      
      finalSubtraction:
        description: The subtraction from job2
        value: >
          First value: ${{ jobs.write_to_output.outputs.subtraction }}

      

jobs:

  write_to_output:
    name: write arithmetic operations to output
    runs-on: ubuntu-latest
    outputs:
      sum: ${{ steps.sum.outputs.sumResult }}
      division: ${{ steps.divide.outputs.divisionResult }}
      multiplication: ${{ steps.multi.outputs.multiResult }}
      subtraction: ${{ steps.subtract.outputs.subtractResult }}

    steps:
      - name: Write sum result to output
        id: sum
        run: |
          echo sumResult=$((50 + 10)) >> $GITHUB_OUTPUT

      - name: Write subtraction result to output
        id: subtract
        run: |
          echo subtractResult=$((80 - 10)) >> $GITHUB_OUTPUT

      - name: Write multiplication result to output
        id: multi
        run: |
          echo multiResult=$((8 * 10)) >> $GITHUB_OUTPUT
        
      - name: Write division result to output
        id: divide
        run: |
          echo divisionResult=$((180 / 2)) >> $GITHUB_OUTPUT
      
      - name: Read sum result from output
        run: |
          echo job1 sum result: ${{ steps.sum.outputs.sumResult }}

  read_from_output:
    name: Read the result from arithmetic operations
    runs-on: ubuntu-latest
    needs: write_to_output

    steps:
      - name: Write some arithmetic operations to output
        id: operations
        run: |
          echo sum=$((10 + 10)) >> $GITHUB_OUTPUT
          echo subtraction=$((40 - 10)) >> $GITHUB_OUTPUT
          echo multiplication=$((4 * 10)) >> $GITHUB_OUTPUT
          echo division=$((100 / 2)) >> $GITHUB_OUTPUT


      - name: Print job2 output
        run: |
          echo job2: sum result: ${{ steps.operations.outputs.sum }}
          echo job2: subtraction result:  ${{ steps.operations.outputs.subtraction }}
          echo job2: multiplication result:  ${{ steps.operations.outputs.multiplication }}
          echo job2: division result:  ${{ steps.operations.outputs.division }}

      - name: Print job1 output
        run: |
          echo job1: sum result: ${{ needs.write_to_output.outputs.sum }}
          echo job1: division result: ${{ needs.write_to_output.outputs.division }}
          echo job1: multiplication result: ${{ needs.write_to_output.outputs.multiplication }}
          echo job1: subtraction result: ${{ needs.write_to_output.outputs.subtraction }}


