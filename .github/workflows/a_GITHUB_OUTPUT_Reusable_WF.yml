name: a1_reusable_wf
on:
  push:
    branches:
      - dev1
  workflow_dispatch:
    inputs:
      exampleInput:
        description: This is an example output
        required: true
        type: string
  
  workflow_call:
    inputs:
      exampleInput:
        required: true
        type: string

    secrets:
      asf_secret:
        description: A secret that caller must provide
        required: true
  
   
  # Alt_1
    # outputs:
    #   allResults:
    #     description: The results from job1 and job2
    #     value: | 
    #       sum: ${{ jobs.write_to_output.outputs.sum }}
    #       subtraction: ${{ jobs.write_to_output.outputs.subtraction }}
    #       multiplication: ${{ jobs.read_from_output.outputs.multiplication }}
    #       division: ${{ jobs.read_from_output.outputs.division }}

  # Alt_2
    outputs:
      finalSum:
        description: The sum from job1
        value: First value ${{ jobs.job1_write_to_output.outputs.sum }}
      
      finalDivision: 
        description: The subtraction from job1
        value: First value ${{ jobs.job1_write_to_output.outputs.subtraction }}
      
      finalMulti:
        description: The multiplication from job2
        value: First value ${{ jobs.job1_write_to_output.outputs.multiplication }}
      
      finalSubtraction:
        description: The division from job2
        value: First value ${{ jobs.job1_write_to_output.outputs.division }}


jobs:

  job1_write_to_output:
    # name: write arithmetic operations to output
    runs-on: ubuntu-latest
    outputs:
      sum: ${{ steps.sum.outputs.sum }}
      subtraction: ${{ steps.subtract.outputs.subtraction }}
      multiplication: ${{ steps.multi.outputs.multiplication }}
      division: ${{ steps.divide.outputs.division }}

    steps:
      - name: Use the secret
        run: |
          echo The secret value is: ${{ secrets.CALLER_SECRET }}
          echo Example input is: ${{ inputs.exampleInput }}

      - name: Write sum result to output
        id: sum
        run: echo sum=$((50 + 10)) >> $GITHUB_OUTPUT

      - name: Write subtraction result to output
        id: subtract
        run: echo subtraction=$((80 - 10)) >> $GITHUB_OUTPUT

      - name: Write multiplication result to output
        id: multi
        run: echo multiplication=$((8 * 10)) >> $GITHUB_OUTPUT
        
      - name: Write division result to output
        id: divide
        run: echo division=$((180 / 2)) >> $GITHUB_OUTPUT
      
      - name: Read from same job
        run: |
          echo job1 sum result: ${{ steps.sum.outputs.sum }}
          echo job1 subtraction result: ${{ steps.subtract.outputs.subtraction }}
          echo job1 multiplication result: ${{ steps.multi.outputs.multiplication }}
          echo job1 division result: ${{ steps.divide.outputs.division }}
      
      - name: Print github.ref
        id: print-github-context
        run: |
          echo github.action is: ${{ github.action }}
          echo github.actor is: ${{ github.actor }}
          echo github.event_name is_tbd: ${{ github.event_name }}
          echo github.job is: ${{ github.job }}
          echo github.ref is: ${{ github.ref }}
          echo github.ref_name is: ${{ github.ref_name }}
          echo github.ref_type is: ${{ github.ref_type }}
          echo github.base_ref is: ${{ github.base_ref }}
          echo github.head_ref is: ${{ github.head_ref }}
          echo github.repository is: ${{ github.repository }}
          echo github.repository_owner is: ${{ github.repository_owner }}
          echo github.run_id is: ${{ github.run_id }}
          echo github.run_number is: ${{ github.run_number }}
          echo github.run_attempt is: ${{ github.run_attempt }}
          echo github.workflow is: ${{ github.workflow }}
          echo github.sha is: ${{ github.sha }}
          echo github.workspace is: ${{ github.workspace }}
          echo github.server_url is: ${{ github.server_url }}
          echo github.api_url is: ${{ github.api_url }}
          echo github.graphql_url is: ${{ github.graphql_url }}
          echo runner.os is: ${{runner.os }}
          echo runner.arch is: ${{runner.arch }}
          echo runner.name is: ${{runner.name }}
          echo runner.temp is: ${{runner.temp }}
          echo runner.tool_cache is: ${{runner.tool_cache }}


  job2_read_from_output:
    # name: Read the result from arithmetic operations
    runs-on: ubuntu-latest
    needs: job1_write_to_output
    outputs:
      sum: ${{ steps.operations.outputs.sum }}
      subtraction: ${{ steps.operations.outputs.subtraction }}
      multiplication: ${{ steps.operations.outputs.multiplication }}
      division: ${{ steps.operations.outputs.division }}

    steps:
      - name: Write some arithmetic operations to output
        id: operations
        run: |
          echo sum=$((10 + 10)) >> $GITHUB_OUTPUT
          echo subtraction=$((40 - 10)) >> $GITHUB_OUTPUT
          echo multiplication=$((4 * 10)) >> $GITHUB_OUTPUT
          echo division=$((100 / 2)) >> $GITHUB_OUTPUT

      - name: Read from same job
        run: |
          echo job2: sum result: ${{ steps.operations.outputs.sum }}
          echo job2: subtraction result:  ${{ steps.operations.outputs.subtraction }}
          echo job2: multiplication result:  ${{ steps.operations.outputs.multiplication }}
          echo job2: division result:  ${{ steps.operations.outputs.division }}

      - name: Read from job1
        run: |
          echo job1: sum result: ${{ needs.job1_write_to_output.outputs.sum }}
          echo job1: division result: ${{ needs.job1_write_to_output.outputs.subtraction }}
          echo job1: multiplication result: ${{ needs.job1_write_to_output.outputs.multiplication }}
          echo job1: subtraction result: ${{ needs.job1_write_to_output.outputs.division }}


 