name: a1_reusable_wf
on:
  workflow_dispatch:
  push:
    branches:
      - dev1
  workflow_call:
    inputs:
      exampleInput:
        description: A secret the caller must provide
        required: true
        type: string
        
    secrets:
      MY_SECRET:
        description: A secret the caller must provide
        required: true
  
    outputs:
      finalSum:
        description: The sum from job1
        value: > 
          First value: ${{ jobs.job1.outputs.calculateSum1 }},
          Second value: ${{ jobs.job1.outputs.calculateSum2 }}
      
      finalDivision: 
        description: The division from job1
        value: >
          First value: ${{ jobs.job1.outputs.calculateDivision1 }},
          Second value: ${{ jobs.job1.outputs.calculateDivision2 }}
      
      finalMulti:
        description: The multiplication from job2
        value: >
          First value: ${{ jobs.job2.outputs.calculateMulti1 }}
          Second value: ${{ jobs.job2.outputs.calculateMulti2 }}
      
      finalSubtraction:
        description: The subtraction from job2
        value: >
          First value: ${{ jobs.job2.outputs.calculateSubtraction1 }}
          Second value: ${{ jobs.job2.outputs.calculateSubtraction2 }}

      

jobs:

  job1:
    name: hello job1
    runs-on: ubuntu-latest
    outputs:
      calculateSum1: ${{ steps.sum.outputs.sumResult1 }}
      calculateSum2: ${{ steps.sum.outputs.sumResult2 }}
      calculateDivision1: ${{ steps.divide.outputs.divisionResult1 }}
      calculateDivision2: ${{ steps.divide.outputs.divisionResult2 }}

    steps:
      - name: Write sum result to output
        id: sum
        run: |
          echo sumResult1=$((15 + 35)) >> $GITHUB_OUTPUT
          echo sumResult2=$((20 + 40)) >> $GITHUB_OUTPUT

      - name: Write division result to output
        id: divide
        run: |
          echo divisionResult1=$((140 / 2)) >> $GITHUB_OUTPUT
          echo divisionResult2=$((160 / 2)) >> $GITHUB_OUTPUT



  job2:
    name: hello job2
    runs-on: ubuntu-latest
    outputs:
      calculateMulti1: ${{ steps.multi.outputs.multiResult1 }}
      calculateMulti2: ${{ steps.multi.outputs.multiResult2 }}
      calculateSubtraction1: ${{ steps.subtract.outputs.subtractResult1 }}
      calculateSubtraction2: ${{ steps.subtract.outputs.subtractResult2 }}

    needs: job1

    steps:
      - name: Write multiplication result to output
        id: multi
        run: |
          echo multiResult1=$((9 * 10)) >> $GITHUB_OUTPUT
          echo multiResult2=$((10 * 10)) >> $GITHUB_OUTPUT

      - name: Write subtraction result to output
        id: subtract
        run: |
          echo subtractResult1=$((120 - 10)) >> $GITHUB_OUTPUT
          echo subtractResult2=$((130 - 10)) >> $GITHUB_OUTPUT
      
      - name: print job2 output
        run: |
          echo job2 multiResult1: ${{ steps.multi.outputs.multiResult1 }}
          echo job2 multiResult2:  ${{ steps.multi.outputs.multiResult2 }}
          echo job2 subtractResult1:  ${{ steps.subtract.outputs.subtractResult1 }}
          echo job2 subtractResult2:  ${{ steps.subtract.outputs.subtractResult2 }}

      - name: print job1 output
        run: |
          echo job1 sumResult1: ${{ needs.job1.outputs.calculateSum1 }}
          echo job1 sumResult2: ${{ needs.job1.outputs.calculateSum2 }}
          echo job1 divisionResult1: ${{ needs.job1.outputs.calculateDivision1 }}
          echo job1 divisionResult2: ${{ needs.job1.outputs.calculateDivision2 }}


