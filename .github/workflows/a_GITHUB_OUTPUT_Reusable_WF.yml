name: a1_reusable_wf
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      finalSum:
        description: The sum from job1
        value: ${{ jobs.job1.outputs.calculateSum }}
      
      finalDivision: 
        description: The division from job1
        value: ${{ jobs.job1.outputs.calculateDivision }}
      
      finalMulti:
        description: The multiplication from job2
        value: ${{ jobs.job2.outputs.calculateMulti }}
      
      finalSubtraction:
        description: The subtraction from job2
        value: ${{ jobs.job2.outputs.calculateSubtraction }}
  push:
    branches:
      - dev
      



jobs:

  job1:
    name: hello job1
    runs-on: ubuntu-latest
    outputs:
      calculateSum: ${{ steps.sum.outputs.sumResult }}
      calculateDivision: ${{ steps.divide.outputs.divisionResult }}

    steps:
      - name: write sum result to output
        id: sum
        run: echo "sumResult=$((15 + 35))" >> $GITHUB_OUTPUT

      - name: write division result to output
        id: divide
        run: echo "divisionResult=$((100 / 4))" >> $GITHUB_OUTPUT



  job2:
    name: hello job2
    runs-on: ubuntu-latest
    outputs:
      calculateMulti: ${{ steps.multi.outputs.multiResult }}
      calculateSubtraction: ${{ steps.subtract.outputs.subtractResult }}
    needs: job1

    steps:
      - name: write multiplication result to output
        id: multi
        run: echo "multiResult=$((4 * 6))" >> $GITHUB_OUTPUT

      - name: write subtraction result to output
        id: subtract
        run: echo "subtractResult=$((27 - 7))" >> $GITHUB_OUTPUT
      
      - name: step1, print job1 output
        run: |
          echo print calculateSum and calculateDivision from job1:
          echo ${{ needs.job1.outputs.calculateSum }}
          echo ${{ needs.job1.outputs.calculateDivision }}

          echo print multiply and subtract results from job2:
          echo ${{ steps.multi.outputs.multiResult }}
          echo ${{ steps.multi.outputs.subtractResult }}