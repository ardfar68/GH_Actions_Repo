# Can be overridden at job level and step level
# Is available in all jobs and their steps unless overridden


name: 1_workflow level environment variables
on:
  workflow_dispatch:
  push:
    branches: 
      - dev
  #   branches-ignore:
  #     - dev
env:
    var1: Hello From workflow Level 1
    var2: Hello From workflow Level 2

jobs:

  job1:
    runs-on: ubuntu-latest

    steps:
      - name: using shell-style variable expansion
        run: |
          echo "workflow env var1: $var1"

      - name: using GH actions expression syntax
        run: |
          echo workflow env var2: ${{env.var2}}
     
      - name: using if statement
        if: ${{ always() && env.var1 == 'Hello From workflow Level 1' }}
        run: |
          echo The result of 2 * 3 * 6 is: $((2 * 3 * 6))
          echo The result of 2 * 3 * 6 / 12 is: $((2 * 3 * 6 / 12))
          echo The result of 2 * 3 * 6 / 12 + 7 is: $((2 * 3 * 6 / 12 + 7))

  job2:
    runs-on: ubuntu-latest

    steps:
      - name: Shell Variable Expansion $var1, GH Actions Expression Syntax using $ {{}}
        run: |
          echo workflow env var1: $var1
          echo workflow env var2: ${{ env.var2 }}
  