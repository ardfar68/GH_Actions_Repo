name: GITHUB_OUTPUT_wf_job
on:
  workflow_call:
    outputs:
      finalSum:
        description: "The sum from job1"
        value: ${{ jobs.job1.outputs.calculateSum }}

jobs:


  job1:
    name: hello job1
    runs-on: ubuntu-latest
    outputs:
      calculateSum: ${{ steps.calc.outputs.sumResult }}
    steps:
      - id: calc
        run: echo "sumResult=42" >> $GITHUB_OUTPUT


  job2:
    name: hello job2
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: print job1 output
        run: |
          echo "print calculateSum from job1: {{ needs.job1.outputs.calculateSum }}"